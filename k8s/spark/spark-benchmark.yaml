apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: 3w-spark-benchmark
  namespace: spark
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: <account_id>.dkr.ecr.us-east-1.amazonaws.com/spark-benchmark:latest
  imagePullPolicy: Always
  mainApplicationFile: "local:///opt/spark/scripts/run_spark_benchmark.py"
  sparkVersion: "3.5.3"
  restartPolicy:
    type: Never
  driver:
    cores: 2
    memory: "4g"
    serviceAccount: spark      # tem a IAM role com acesso S3 via IRSA
  executor:
    cores: 2
    instances: 2
    memory: "4g"
  sparkConf:
    "spark.jars.ivy": "/tmp/.ivy"
    "spark.sql.shuffle.partitions": "8"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "com.amazonaws.auth.DefaultAWSCredentialsProviderChain"
    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.kubernetes.driverEnv.DATASET_PATH": "s3a://streaming-3w/3w/dataset"
    "spark.kubernetes.driverEnv.OUTPUT_PATH": "s3a://streaming-3w/results/spark"
