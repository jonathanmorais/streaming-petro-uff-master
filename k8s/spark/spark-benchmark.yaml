apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: benchmark-3w-spark
  namespace: spark
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: 428655986332.dkr.ecr.us-east-1.amazonaws.com/spark-benchmark:latest
  imagePullPolicy: Always
  mainApplicationFile: "local:///opt/spark/scripts/run_spark_benchmark.py"
  sparkVersion: "3.5.3"
  restartPolicy:
    type: Never
  driver:
    cores: 2
    memory: "2g"
    serviceAccount: spark      # tem a IAM role com acesso S3 via IRSA
  executor:
    cores: 2 # evitar overcommit de CPU — pode causar throttling e degradação de performance
    coreRequest: "700m" # evitar overcommit de CPU — pode causar throttling e degradação de performance
    coreLimit: "1500m" # tolerar picos de CPU sem throttling — Spark pode usar mais CPU em momentos de alta demanda
    instances: 2
    memory: "1500m"
    serviceAccount: spark  # IRSA: mesma role do driver — executors também precisam de acesso S3
  sparkConf:
    "spark.jars.ivy": "/tmp/.ivy"
    "spark.sql.shuffle.partitions": "8"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "com.amazonaws.auth.DefaultAWSCredentialsProviderChain"
    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.kubernetes.driverEnv.DATASET_PATH": "s3a://streaming-3w/3w/dataset"
    "spark.kubernetes.driverEnv.OUTPUT_PATH": "s3a://streaming-3w/results/spark"
    "spark.kubernetes.executor.serviceAccountName": "spark"
    # Dataset normalizado via k8s/normalize-job.yaml — sem TIMESTAMP(NANOS) nem Brotli.
    # Leitor vetorizado padrão funciona sem workarounds.
